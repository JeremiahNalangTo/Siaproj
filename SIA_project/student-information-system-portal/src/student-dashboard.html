<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BSTA — Student Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <img src="assets/images/logo.png" alt="logo" class="top-logo">
    <nav>
      <button id="logoutBtn" class="btn secondary">Logout</button>
    </nav>
  </header>

  <main class="container">
    <aside class="sidebar">
      <ul>
        <li><a href="#" data-view="profile">Profile</a></li>
        <li><a href="#" data-view="available">Available Classes</a></li>
        <li><a href="#" data-view="enrolled">My Classes</a></li>
        <li><a href="#" data-view="grades">Grades</a></li>
      </ul>
    </aside>

    <section class="panel" id="panel">
      <!-- injected by js -->
    </section>
  </main>
</body>
</html>
