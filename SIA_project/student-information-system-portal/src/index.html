<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>BSTA — Believe, Strive, Thrive Academy</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/app.js" defer></script>

    <style>
        /* Inline page-specific styles */
        :root{
            --blue: #1565C0;
            --yellow: #FFD54F;
            --muted: #6b7280;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        /* Make body a column so footer sits at bottom */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(90deg, var(--yellow) 40%, var(--blue) 40%);
            color: #111827;
        }

        /* Center main area but allow it to grow so footer is pushed down */
        .layout {
            flex: 1 1 auto;
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(2,6,23,0.12);
            border-radius: 12px;
            overflow: hidden;
            margin: 32px auto;
            background: transparent;
        }

        /* right: hero with image/overlay */
        .hero{
            width: 100%;
            height: 60vh;
            max-height: 760px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            border-radius: 12px;
            overflow: hidden;
        }

        .hero::before{
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(21,101,192,0.85), rgba(0,47,108,0.72));
            pointer-events: none;
        }

        .hero .bg{
            position: absolute;
            inset: 0;
            background-image: url('assets/images/bg-login.jpg');
            background-size: cover;
            background-position: center;
            filter: brightness(.6) saturate(.95);
            z-index: 0;
        }

        .hero-content{
            position: relative;
            z-index: 1;
            padding: 32px;
            text-align: center;
            max-width: 720px;
        }

        .hero h2{
            margin: 0 0 12px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .hero p{ margin: 0; color: rgba(255,255,255,0.95); font-size: 16px; }

        .cta {
            margin-top: 18px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .cta .primary {
            background: #0b63a8;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }

        .cta .outline {
            background: transparent;
            color: rgba(255,255,255,0.95);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.18);
            text-decoration: none;
            display: inline-block;
        }

        /* Footer fixed to bottom of document flow */
        footer.site-footer {
            width: 100%;
            background: #1f2937; /* dark gray */
            text-align: center;
            padding: 14px 0;
            color: #ffffff; /* light text for contrast */
            font-size: 13px;
            flex-shrink: 0;
        }

        @media (max-width: 900px) {
            .layout { margin: 18px; }
            .hero { height: 50vh; }
            .hero-content { padding: 18px; }
        }
    </style>
</head>
<body>
    <main class="layout" role="main" aria-labelledby="welcome">
        <section class="hero" aria-hidden="false" aria-labelledby="welcome">
            <div class="bg" aria-hidden="true"></div>
            <div class="hero-content">
                <h2 id="welcome">Welcome to BSTA Portal</h2>
                <p>Access student records, class schedules, grades, announcements and more. Log in to continue.</p>

                <div class="cta" role="group" aria-label="Primary actions">
                    <a class="primary" href="login.html">LOGIN</a>
                    <a class="outline" href="register.html">REGISTER</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        &copy; <span id="year"></span> BSTA — Believe, Strive, Thrive Academy made by Jeremiah C. Mullon from LFAU311N010
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
