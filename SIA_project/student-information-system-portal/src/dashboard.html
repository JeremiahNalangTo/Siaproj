<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Information System</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
        <!-- Include header component -->
        <div id="header"></div>
    </header>

    <main>
        <h1>Welcome to the Student Information System Dashboard</h1>
        <nav>
            <ul>
                <li><a href="students.html">Manage Students</a></li>
                <li><a href="teachers.html">Manage Teachers</a></li>
                <li><a href="admin.html">Admin Settings</a></li>
            </ul>
        </nav>
        <section>
            <h2>Overview</h2>
            <p>This is your dashboard where you can navigate to different sections of the portal.</p>
        </section>
    </main>

    <footer>
        <!-- Include footer component -->
        <div id="footer"></div>
    </footer>

    <script>
        // Load header and footer components
        fetch('components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });
    </script>
</body>
</html>
