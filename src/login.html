<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BSTA — Login</title>
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/auth.js" defer></script>
</head>
<body class="login-page">
  <main class="layout">
    <aside class="auth-panel">
      <div class="brand">
        <img src="assets/images/logo.png" alt="BSTA logo">
        <div>
          <h1>BSTA</h1>
          <p>Sign in</p>
        </div>
      </div>

      <div class="card">
        <form id="loginForm" autocomplete="off">
          <label for="role">Account type</label>
          <select id="role" required>
            <option value="student">Student</option>
            <option value="professor">Professor</option>
          </select>

          <label for="username">Username</label>
          <input id="username" type="text" placeholder="username" required>

          <label for="password">Password</label>
          <input id="password" type="password" placeholder="password" required>

          <div class="actions">
            <button class="btn" type="submit">Login</button>
            <a class="btn secondary" href="register.html">Create account</a>
          </div>

          <p class="small" style="margin-top:10px;color:var(--muted)">
            Forgot password? <a href="reset.html">Reset here</a>
          </p>
        </form>
      </div>
    </aside>

    <section class="hero">
      <div class="bg"></div>
      <div class="hero-content">
        <h2>Welcome to BSTA Portal</h2>
        <p>Access student records, class schedules, grades, announcements and more. Log in to continue.</p>
      </div>
    </section>
  </main>
</body>
</html>
